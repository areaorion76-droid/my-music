<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя Музыка</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
            padding-bottom: 200px;
        }
        
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 24px;
            color: #e94560;
        }
        
        .track-list {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 15px;
            margin-bottom: 20px;
        }
        
        .track {
            display: flex;
            align-items: center;
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            background: rgba(255,255,255,0.03);
        }
        
        .track:hover {
            background: rgba(233, 69, 96, 0.2);
        }
        
        .track.active {
            background: rgba(233, 69, 96, 0.3);
            border-left: 3px solid #e94560;
        }
        
        .track-number {
            width: 30px;
            color: #888;
            font-size: 14px;
        }
        
        .track-info {
            flex: 1;
        }
        
        .track-name {
            font-size: 15px;
            margin-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .track-artist {
            font-size: 12px;
            color: #888;
        }
        
        .player-controls {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(26, 26, 46, 0.95);
            backdrop-filter: blur(20px);
            padding: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        
        .now-playing {
            text-align: center;
            margin-bottom: 15px;
        }
        
        .now-playing-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .progress-container {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
            margin-bottom: 20px;
            cursor: pointer;
        }
        
        .progress {
            height: 100%;
            background: #e94560;
            border-radius: 2px;
            width: 0%;
            transition: width 0.1s;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            margin-bottom: 15px;
        }
        
        .btn {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            transition: transform 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .btn:hover {
            transform: scale(1.1);
        }
        
        .btn:active {
            transform: scale(0.95);
        }
        
        .btn-play {
            width: 60px;
            height: 60px;
            background: #e94560;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .btn-play svg {
            width: 24px;
            height: 24px;
            fill: #fff;
        }
        
        .btn-icon {
            width: 24px;
            height: 24px;
            fill: #fff;
        }
        
        .btn-loop.active {
            color: #e94560;
        }
        
        .volume-container {
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
        }
        
        .volume-slider {
            width: 100px;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
            outline: none;
        }
        
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            background: #e94560;
            border-radius: 50%;
            cursor: pointer;
        }
        
        .time {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #888;
            margin-bottom: 10px;
        }
        
        .add-track {
            background: rgba(233, 69, 96, 0.2);
            border: 2px dashed #e94560;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .add-track:hover {
            background: rgba(233, 69, 96, 0.3);
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: #1a1a2e;
            padding: 30px;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
        }
        
        .modal h3 {
            margin-bottom: 20px;
            color: #e94560;
        }
        
        .modal input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 16px;
        }
        
        .modal input::placeholder {
            color: #666;
        }
        
        .modal-buttons {
            display: flex;
            gap: 10px;
        }
        
        .modal-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        .modal-btn.primary {
            background: #e94560;
            color: #fff;
        }
        
        .modal-btn.secondary {
            background: rgba(255,255,255,0.1);
            color: #fff;
        }
        
        .delete-btn {
            opacity: 0;
            transition: opacity 0.3s;
            color: #e94560;
            font-size: 18px;
            padding: 5px;
        }
        
        .track:hover .delete-btn {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎵 Моя Коллекция</h1>
        
        <div class="add-track" onclick="openModal()">
            + Добавить трек
        </div>
        
        <div id="trackList" class="track-list">
            <div style="text-align: center; padding: 40px; color: #888;">
                Пока нет треков.<br>Нажми "Добавить трек" выше.
            </div>
        </div>
    </div>
    
    <div class="player-controls">
        <div class="now-playing">
            <div class="now-playing-title" id="nowPlaying">Выберите трек</div>
        </div>
        
        <div class="time">
            <span id="currentTime">0:00</span>
            <span id="duration">0:00</span>
        </div>
        
        <div class="progress-container" id="progressContainer">
            <div class="progress" id="progress"></div>
        </div>
        
        <div class="controls">
            <button class="btn" id="prevBtn">
                <svg class="btn-icon" viewBox="0 0 24 24">
                    <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
                </svg>
            </button>
            
            <button class="btn btn-play" id="playBtn">
                <svg viewBox="0 0 24 24" id="playIcon">
                    <path d="M8 5v14l11-7z"/>
                </svg>
                <svg viewBox="0 0 24 24" id="pauseIcon" style="display:none">
                    <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                </svg>
            </button>
            
            <button class="btn" id="nextBtn">
                <svg class="btn-icon" viewBox="0 0 24 24">
                    <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
                </svg>
            </button>
        </div>
        
        <div style="display: flex; justify-content: center; gap: 20px; align-items: center;">
            <button class="btn btn-loop" id="loopBtn" title="Зациклить трек">
                <svg class="btn-icon" viewBox="0 0 24 24">
                    <path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/>
                </svg>
            </button>
            
            <div class="volume-container">
                <svg class="btn-icon" viewBox="0 0 24 24" style="width: 20px; height: 20px;">
                    <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                </svg>
                <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="70">
            </div>
        </div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <h3>Добавить трек</h3>
            <input type="text" id="trackName" placeholder="Название трека">
            <input type="text" id="trackUrl" placeholder="Ссылка на MP3 (Яндекс.Диск)">
            <div class="modal-buttons">
                <button class="modal-btn secondary" onclick="closeModal()">Отмена</button>
                <button class="modal-btn primary" onclick="addTrack()">Добавить</button>
            </div>
        </div>
    </div>

    <audio id="audioPlayer"></audio>

    <script>
        // Треки хранятся в памяти (можно расширить для сохранения в localStorage)
        let tracks = [];
        let currentTrackIndex = 0;
        let isPlaying = false;
        let isLooping = false;
        
        const audio = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const loopBtn = document.getElementById('loopBtn');
        const volumeSlider = document.getElementById('volumeSlider');
        const progress = document.getElementById('progress');
        const progressContainer = document.getElementById('progressContainer');
        const nowPlaying = document.getElementById('nowPlaying');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');
        const trackListEl = document.getElementById('trackList');
        const modal = document.getElementById('modal');
        
        // Загружаем треки из localStorage при старте
        function loadTracks() {
            const saved = localStorage.getItem('myMusicTracks');
            if (saved) {
                tracks = JSON.parse(saved);
                renderTrackList();
            }
        }
        
        function saveTracks() {
            localStorage.setItem('myMusicTracks', JSON.stringify(tracks));
        }
        
        function renderTrackList() {
            if (tracks.length === 0) {
                trackListEl.innerHTML = `
                    <div style="text-align: center; padding: 40px; color: #888;">
                        Пока нет треков.<br>Нажми "Добавить трек" выше.
                    </div>
                `;
                return;
            }
            
            trackListEl.innerHTML = tracks.map((track, index) => `
                <div class="track ${index === currentTrackIndex ? 'active' : ''}" onclick="playTrack(${index})">
                    <div class="track-number">${index + 1}</div>
                    <div class="track-info">
                        <div class="track-name">${track.name}</div>
                        <div class="track-artist">Трек ${index + 1}</div>
                    </div>
                    <span class="delete-btn" onclick="deleteTrack(event, ${index})">🗑</span>
                </div>
            `).join('');
        }
        
        function openModal() {
            modal.classList.add('active');
            document.getElementById('trackName').focus();
        }
        
        function closeModal() {
            modal.classList.remove('active');
            document.getElementById('trackName').value = '';
            document.getElementById('trackUrl').value = '';
        }
        
        function addTrack() {
            const name = document.getElementById('trackName').value.trim();
            const url = document.getElementById('trackUrl').value.trim();
            
            if (!name || !url) {
                alert('Заполни оба поля!');
                return;
            }
            
            // Преобразуем ссылку Яндекс.Диска в прямую ссылку
            let directUrl = url;
            
            // Если это ссылка вида https://disk.yandex.ru/i/XXXX
            if (url.includes('disk.yandex.ru/i/')) {
                const fileId = url.split('/i/')[1].split('?')[0];
                directUrl = `https://cloud-api.yandex.net/v1/disk/public/resources/download?public_key=${encodeURIComponent(url)}`;
            }
            
            tracks.push({
                name: name,
                url: url, // Используем оригинальную ссылку
                artist: 'Моя Коллекция'
            });
            
            saveTracks();
            renderTrackList();
            closeModal();
        }
        
        function deleteTrack(event, index) {
            event.stopPropagation();
            if (confirm('Удалить трек?')) {
                tracks.splice(index, 1);
                if (currentTrackIndex >= tracks.length) {
                    currentTrackIndex = 0;
                }
                saveTracks();
                renderTrackList();
            }
        }
        
        function formatTime(seconds) {
            if (isNaN(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }
        
        function playTrack(index) {
            if (tracks.length === 0) return;
            
            currentTrackIndex = index;
            const track = tracks[index];
            
            audio.src = track.url;
            nowPlaying.textContent = track.name;
            
            document.querySelectorAll('.track').forEach((el, i) => {
                el.classList.toggle('active', i === index);
            });
            
            audio.play().catch(e => {
                console.error('Ошибка воспроизведения:', e);
                alert('Не удалось воспроизвести. Попробуй другую ссылку или формат файла.');
            });
            
            isPlaying = true;
            updatePlayButton();
        }
        
        function togglePlay() {
            if (tracks.length === 0) return;
            
            if (isPlaying) {
                audio.pause();
            } else {
                if (!audio.src) {
                    playTrack(0);
                } else {
                    audio.play();
                }
            }
            isPlaying = !isPlaying;
            updatePlayButton();
        }
        
        function updatePlayButton() {
            playIcon.style.display = isPlaying ? 'none' : 'block';
            pauseIcon.style.display = isPlaying ? 'block' : 'none';
        }
        
        function playNext() {
            if (tracks.length === 0) return;
            const next = (currentTrackIndex + 1) % tracks.length;
            playTrack(next);
        }
        
        function playPrev() {
            if (tracks.length === 0) return;
            const prev = (currentTrackIndex - 1 + tracks.length) % tracks.length;
            playTrack(prev);
        }
        
        function toggleLoop() {
            isLooping = !isLooping;
            loopBtn.classList.toggle('active', isLooping);
        }
        
        // Обработчики
        playBtn.addEventListener('click', togglePlay);
        nextBtn.addEventListener('click', playNext);
        prevBtn.addEventListener('click', playPrev);
        loopBtn.addEventListener('click', toggleLoop);
        
        volumeSlider.addEventListener('input', (e) => {
            audio.volume = e.target.value / 100;
        });
        
        audio.addEventListener('timeupdate', () => {
            const percent = (audio.currentTime / audio.duration) * 100;
            progress.style.width = percent + '%';
            currentTimeEl.textContent = formatTime(audio.currentTime);
            durationEl.textContent = formatTime(audio.duration);
        });
        
        audio.addEventListener('ended', () => {
            if (isLooping) {
                audio.currentTime = 0;
                audio.play();
            } else {
                playNext();
            }
        });
        
        progressContainer.addEventListener('click', (e) => {
            const rect = progressContainer.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            audio.currentTime = percent * audio.duration;
        });
        
        // Закрытие модалки по клику вне её
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });
        
        // Инициализация
        audio.volume = 0.7;
        loadTracks();
    </script>
</body>
</html>
